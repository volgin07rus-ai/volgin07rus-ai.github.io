<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Места — приложение для всех ваших мест</title>
<meta name="description" content="Витрина двух экранов мобильного приложения «Места»: онбординг и подписка Pro.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Cormorant Garamond подхватывает кириллицу вместо ITC Garamond (в нём её нет).
     Inter — интерфейсный текст, Playfair Display — запасной серифный. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ШРИФТЫ
   ITC Garamond Std Narrow не содержит кириллических глифов,
   поэтому русский текст автоматически берётся из Cormorant
   Garamond — следующего в стеке. Латиница (Pro, Apple) при
   этом остаётся в оригинальной гарнитуре.
   ============================================================ */
@font-face{
  font-family:'ITC Garamond Std Narrow';
  src:url('https://res.cloudinary.com/dgupuutfn/raw/upload/v1783596334/ITCGaramondStd-LtNarrow_i2zcip.woff2') format('woff2'),
      url('https://res.cloudinary.com/dgupuutfn/raw/upload/v1783596334/ITCGaramondStd-LtNarrow_soc5vc.woff') format('woff');
  font-weight:300;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'ITC Garamond Std Narrow';
  src:url('https://res.cloudinary.com/dgupuutfn/raw/upload/v1783596334/ITCGaramondStd-BkNarrow_xjfoc0.woff2') format('woff2'),
      url('https://res.cloudinary.com/dgupuutfn/raw/upload/v1783596334/ITCGaramondStd-BkNarrow_wfoxm1.woff') format('woff');
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'ITC Garamond Std Narrow';
  src:url('https://res.cloudinary.com/dgupuutfn/raw/upload/v1783596334/ITCGaramondStd-BkNarrowIta_hiy9ld.woff2') format('woff2'),
      url('https://res.cloudinary.com/dgupuutfn/raw/upload/v1783596334/ITCGaramondStd-BkNarrowIta_rlarxo.woff') format('woff');
  font-weight:400;font-style:italic;font-display:swap;
}

:root{
  --serif:'ITC Garamond Std Narrow','Cormorant Garamond','Playfair Display',Georgia,serif;
  --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#F4F4F4;
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:40px;
  overflow:hidden;
}

/* ================= СЦЕНА ================= */
.viewport{display:flex;align-items:center;justify-content:center}
.stage{
  display:flex;align-items:center;gap:70px;
  transform-origin:center center;
  will-change:transform;
}

/* ================= КОРПУС УСТРОЙСТВА ================= */
.phone{
  position:relative;
  width:370px;height:790px;
  border-radius:48px;
  overflow:hidden;
  flex:none;
  box-shadow:0 40px 80px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.12);
}
.phone--light{background:#F2F2F7}
.phone--dark{background:#000}

/* Динамический остров */
.island{
  position:absolute;left:50%;top:11px;transform:translateX(-50%);
  width:126px;height:37px;border-radius:24px;background:#000;
  z-index:60;pointer-events:none;
}

/* Статус-бар */
.statusbar{
  position:absolute;left:0;top:0;width:100%;height:54px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 30px 0 34px;
  z-index:55;pointer-events:none;
}
.statusbar .time{
  font-family:-apple-system,'SF Pro Text','Inter',sans-serif;
  font-weight:590;font-size:17px;color:#fff;letter-spacing:.1px;
  padding-top:4px;
}
.statusbar .icons{display:flex;align-items:center;gap:6px;padding-top:4px}

/* Индикатор «домой» */
.home-indicator{
  position:absolute;left:50%;bottom:9px;transform:translateX(-50%);
  width:139px;height:5px;border-radius:100px;
  z-index:60;pointer-events:none;
}
/* Оба экрана заливаются тёмным контентом до самого низа,
   поэтому индикатор светлый на обоих корпусах. */
.home-indicator{background:rgba(255,255,255,.7)}

/* ============================================================
   ЭКРАН 1 — «Место для всех ваших мест»
   Макет свёрстан в натуральных 470×1008 и ужат до 370×790.
   ============================================================ */
.screen1{position:absolute;inset:0;background:#02040c;overflow:hidden}
.s1-native{
  position:absolute;left:0;top:0;
  width:470px;height:1008px;
  transform:scale(.787234);
  transform-origin:top left;
}
.s1-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 48%;
  z-index:0;
}
.s1-fade{
  position:absolute;left:0;bottom:0;width:100%;height:46%;
  background:linear-gradient(to bottom,rgba(2,4,12,0) 0%,rgba(2,4,12,.35) 46%,rgba(2,4,12,.72) 100%);
  z-index:1;
}
.s1-logo{
  position:absolute;left:50%;top:74px;transform:translateX(-50%);
  width:118px;height:auto;z-index:4;
  filter:drop-shadow(0 0 7px rgba(190,215,255,.28));
}
.s1-title{
  position:absolute;left:0;top:618px;width:100%;
  margin:0;text-align:center;z-index:4;
  font-family:var(--serif);
  font-weight:300;font-size:66px;line-height:68px;letter-spacing:.2px;
  color:#fff;
  text-shadow:0 0 34px rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.35);
}
.s1-title em{
  font-style:italic;font-weight:400;
  text-shadow:0 0 10px rgba(255,255,255,.6),0 0 20px rgba(255,235,190,.5),0 0 40px rgba(255,210,140,.32);
}
.s1-sub{
  position:absolute;left:0;top:787px;width:100%;
  margin:0;text-align:center;z-index:4;
  font-family:var(--ui);
  font-size:16.5px;font-weight:400;line-height:26px;
  color:rgba(255,255,255,.52);
}
.s1-btn{
  position:absolute;left:32px;top:874px;
  width:406px;height:55px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:#fff;border:0;border-radius:28px;
  box-shadow:0 6px 26px rgba(0,0,0,.28);
  z-index:4;cursor:pointer;
  font-family:'Helvetica Neue',var(--ui);
  font-size:18px;font-weight:500;color:#1a1a1a;
  -webkit-text-stroke:.6px #1a1a1a;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);
}
.s1-btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(0,0,0,.34)}
.s1-btn:active{transform:scale(.975)}
.s1-btn svg{flex:none;margin-top:-2px}
.s1-terms{
  position:absolute;left:0;top:950px;width:100%;
  margin:0;text-align:center;z-index:4;
  font-family:var(--ui);
  font-size:12px;font-weight:400;color:rgba(255,255,255,.42);
}
.s1-terms b{color:rgba(255,255,255,.82);font-weight:400}

/* ============================================================
   ЭКРАН 2 — «Откройте Pro»
   ============================================================ */
.screen2{position:absolute;inset:0;background:#14151d;overflow:hidden}
.s2-video{
  position:absolute;left:0;top:-30%;
  width:370px;height:790px;object-fit:cover;z-index:0;
}
.s2-fade{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(to bottom,
    rgba(20,21,29,0) 0%,rgba(20,21,29,0) 40%,
    rgba(20,21,29,.55) 55%,rgba(20,21,29,.92) 66%,
    #14151d 74%,#14151d 100%);
}
.s2-h{
  position:absolute;left:28px;top:386px;margin:0;z-index:4;
  font-family:var(--serif);
  font-weight:500;font-size:26px;line-height:1;letter-spacing:.2px;
  color:#fff;
  text-shadow:0 0 18px rgba(120,180,220,.35);
}
.s2-divider{
  position:absolute;left:28px;top:418px;width:265px;height:1px;z-index:4;
  background:linear-gradient(to right,rgba(255,255,255,.30) 0%,rgba(255,255,255,.30) 70%,rgba(255,255,255,0) 100%);
  transform-origin:left center;
}
.s2-list{
  position:absolute;left:28px;top:429px;width:314px;
  margin:0;padding:0;list-style:none;z-index:4;
}
.s2-row{
  height:24px;display:flex;align-items:center;
  color:#fff;
}
.s2-row .ico{width:22px;display:flex;align-items:center;justify-content:flex-start;flex:none}
.s2-row .txt{font-family:var(--ui);font-size:13.5px;font-weight:400;margin-left:4px;white-space:nowrap}

/* Тарифы */
.s2-plans{position:absolute;left:28px;top:561px;width:314px;height:123px;z-index:4}
.plan{
  position:absolute;top:0;height:123px;border-radius:14px;
  border:1px solid rgba(255,255,255,.11);
  padding:14px 14px 15px 15px;
  display:flex;flex-direction:column;
  cursor:pointer;
  transition:transform .25s var(--ease),border-color .25s var(--ease);
}
.plan:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.26)}
.plan:active{transform:scale(.98)}
.plan-month{
  left:0;width:144px;
  background-image:url('https://polo-pecan-73837341.figma.site/_assets/v11/ef4533e6536f2495088e56e0f98036b5ff15446d.png');
  background-size:cover;background-position:center;
}
.plan-month *{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.plan-year{left:154px;width:160px;background:#1e212a}
.plan .label{font-family:var(--ui);font-size:13px;font-weight:400;line-height:1}
.plan .price{font-family:var(--ui);font-size:19px;font-weight:500;letter-spacing:.3px;margin-top:6px;line-height:1}
.plan .billed{font-family:var(--ui);font-size:12px;font-weight:400;margin-top:auto;line-height:1}
.plan-year .label,.plan-year .billed{color:rgba(255,255,255,.50)}
.plan-year .price{color:rgba(255,255,255,.62)}
/* Отсчёт идёт от .s2-plans, а бейдж принадлежит годовой карточке:
   её левый край 154px + отступ 15px внутри карточки. */
.save{
  position:absolute;left:169px;top:66px;
  display:inline-flex;align-items:center;
  padding:5px 8px;border-radius:11px;background:#4d5057;
  font-family:var(--ui);font-size:10.5px;font-weight:600;letter-spacing:.2px;
  color:rgba(255,255,255,.65);white-space:nowrap;
  z-index:5;
}
.s2-btn{
  position:absolute;left:28px;top:709px;
  width:314px;height:50px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:#fff;border:0;border-radius:26px;z-index:4;cursor:pointer;
  font-family:'Helvetica Neue',var(--ui);
  font-size:16px;font-weight:500;color:#0c0c0e;
  -webkit-text-stroke:.4px #0c0c0e;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);
}
.s2-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.s2-btn:active{transform:scale(.975)}
.s2-btn svg{transition:transform .22s var(--ease)}
.s2-btn:hover svg{transform:translateX(3px)}

button:focus-visible,.plan:focus-visible{outline:2px solid #7fb2ff;outline-offset:3px}

/* ============================================================
   АНИМАЦИИ ПОЯВЛЕНИЯ
   Запускаются только после .ze-ready на .viewport.
   ============================================================ */
@keyframes zeBgSettle{from{transform:scale(1.12);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes zeReveal{from{transform:translateY(26px) scale(.985);filter:blur(7px);opacity:0}to{transform:translateY(0) scale(1);filter:blur(0);opacity:1}}
@keyframes zeDrop{from{transform:translate(-50%,-16px) scale(.90);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes zeLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes zePop{
  0%{transform:translateY(8px) scale(.78);opacity:0}
  60%{transform:translateY(0) scale(1.07);opacity:1}
  100%{transform:translateY(0) scale(1);opacity:1}
}

.anim{opacity:0}
.ze-ready .anim{animation-duration:.9s;animation-timing-function:var(--ease);animation-fill-mode:both}
.ze-ready .a-bg{animation-name:zeBgSettle;animation-duration:1.7s}
.ze-ready .a-reveal{animation-name:zeReveal}
.ze-ready .a-drop{animation-name:zeDrop}
.ze-ready .a-line{animation-name:zeLine}
.ze-ready .a-pop{animation-name:zePop;animation-duration:.7s;animation-timing-function:var(--spring)}

/* Тайминг — экран 1 */
.ze-ready .s1-bgwrap{animation-delay:0s}
.ze-ready .s1-logo{animation-delay:.45s}
.ze-ready .s1-title{animation-delay:.62s}
.ze-ready .s1-sub{animation-delay:.78s}
.ze-ready .s1-btn{animation-delay:.94s}
.ze-ready .s1-terms{animation-delay:1.06s}
/* Тайминг — экран 2 */
.ze-ready .s2-bgwrap{animation-delay:.12s}
.ze-ready .s2-h{animation-delay:.58s}
.ze-ready .s2-divider{animation-delay:.72s}
.ze-ready .s2-row:nth-child(1){animation-delay:.80s}
.ze-ready .s2-row:nth-child(2){animation-delay:.88s}
.ze-ready .s2-row:nth-child(3){animation-delay:.96s}
.ze-ready .s2-row:nth-child(4){animation-delay:1.04s}
.ze-ready .s2-row:nth-child(5){animation-delay:1.12s}
.ze-ready .plan-month{animation-delay:1.22s}
.ze-ready .plan-year{animation-delay:1.30s}
.ze-ready .s2-btn{animation-delay:1.42s}
.ze-ready .save{animation-delay:1.55s}

/* Обёртки фонов, чтобы масштаб анимации не спорил с позиционированием */
.s1-bgwrap,.s2-bgwrap{position:absolute;inset:0;z-index:0;overflow:hidden}

@media (prefers-reduced-motion:reduce){
  .anim,.ze-ready .anim{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}
  .ze-ready .s1-logo,.anim.s1-logo{transform:translateX(-50%)!important}
  .s1-btn,.s2-btn,.plan,.s2-btn svg{transition:none!important}
}
</style>
</head>
<body>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <!-- ============ ЭКРАН 1 ============ -->
    <div class="phone phone--light">
      <div class="screen1">
        <div class="s1-native">

          <div class="s1-bgwrap anim a-bg">
            <video class="s1-video" data-gate autoplay loop muted playsinline
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260710_114906_ad7cee37-9e56-434f-99bc-92d5bdc4f9fe.mp4"></video>
          </div>
          <div class="s1-fade"></div>

          <img class="s1-logo anim a-drop" alt="Логотип приложения «Места»"
            src="https://polo-pecan-73837341.figma.site/_assets/v11/b1ddc82509144261f1999a0c4d92be5ce6689c0f.png">

          <h1 class="s1-title anim a-reveal">Место для всех<br><em>ваших мест</em></h1>

          <p class="s1-sub anim a-reveal">Сохраняйте, организуйте и делитесь<br>любимыми местами</p>

          <button class="s1-btn anim a-reveal" type="button">
            <svg width="18" height="21" viewBox="0 0 384 512" fill="#1a1a1a" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
            Войти через Apple
          </button>

          <p class="s1-terms anim a-reveal">Продолжая, вы принимаете <b>Условия использования</b></p>
        </div>
      </div>

      <div class="statusbar">
        <span class="time">11:11</span>
        <span class="icons">
          <!-- сигнал -->
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff" aria-hidden="true">
            <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/>
            <rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/>
          </svg>
          <!-- wi-fi -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M1 4.1C3 2.2 5.6 1.2 8.5 1.2S14 2.2 16 4.1"/>
            <path d="M3.7 6.9c1.3-1.2 3-1.9 4.8-1.9s3.5.7 4.8 1.9"/>
            <path d="M6.5 9.6c.6-.5 1.3-.8 2-.8s1.4.3 2 .8"/>
          </svg>
          <!-- батарея -->
          <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true">
            <rect x="0.6" y="0.6" width="23" height="11.8" rx="3.4" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/>
            <rect x="2.4" y="2.4" width="18" height="8.2" rx="2.1" fill="#fff"/>
            <path d="M25.2 4.5c1 .5 1 3.5 0 4V4.5z" fill="#fff" fill-opacity=".45"/>
          </svg>
        </span>
      </div>
      <div class="island"></div>
      <div class="home-indicator"></div>
    </div>

    <!-- ============ ЭКРАН 2 ============ -->
    <div class="phone phone--dark">
      <div class="screen2">

        <div class="s2-bgwrap anim a-bg">
          <video class="s2-video" data-gate autoplay loop muted playsinline
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260710_115050_a1ba47d0-aedf-413c-9dea-14509599d3dd.mp4"></video>
        </div>
        <div class="s2-fade"></div>

        <h2 class="s2-h anim a-reveal">Откройте Pro:</h2>
        <div class="s2-divider anim a-line"></div>

        <ul class="s2-list">
          <li class="s2-row anim a-reveal">
            <span class="ico">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/>
              </svg>
            </span>
            <span class="txt">Личные подборки мест</span>
          </li>
          <li class="s2-row anim a-reveal">
            <span class="ico">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="6" y="2.5" width="12" height="19" rx="2.5"/><line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/>
              </svg>
            </span>
            <span class="txt">Импорт из соцсетей</span>
          </li>
          <li class="s2-row anim a-reveal">
            <span class="ico">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.988-8-13.083-8-5.096 0-5.096 8 0 8 5.095 0 7.988-8 13.083-8z"/>
              </svg>
            </span>
            <span class="txt">Безлимитные подборки</span>
          </li>
          <li class="s2-row anim a-reveal">
            <span class="ico">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3c.4 3.6 1.4 4.6 5 5-3.6.4-4.6 1.4-5 5-.4-3.6-1.4-4.6-5-5 3.6-.4 4.6-1.4 5-5Z"/>
              </svg>
            </span>
            <span class="txt">Поиск с ИИ</span>
          </li>

<script>
(function(){
  const viewport = document.getElementById('viewport')
  const stage = document.getElementById('stage')

  /* ---------- Подгон сцены под окно ---------- */
  function fit(){
    // В фоновой вкладке размеры окна какое-то время нулевые — пропускаем такой замер,
    // иначе масштаб уходит в минус и сцена выворачивается наизнанку.
    const vw = window.innerWidth || document.documentElement.clientWidth
    const vh = window.innerHeight || document.documentElement.clientHeight
    if (!vw || !vh) return

    // Замеряем нескалированный размер сцены
    const prev = stage.style.transform
    stage.style.transform = 'none'
    const w = stage.offsetWidth
    const h = stage.offsetHeight
    stage.style.transform = prev
    if (!w || !h) return

    const pad = 80 // 40px по каждой стороне
    const ratio = Math.min(1, (vw - pad) / w, (vh - pad) / h)
    stage.style.transform = 'scale(' + Math.max(0.1, ratio * 0.95).toFixed(4) + ')'
  }
  fit()
  window.addEventListener('resize', fit)
  window.addEventListener('load', fit)
  // Окно может получить реальные размеры позже вкладки — следим за корнем документа
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement)

  /* ---------- Старт анимаций ---------- */
  let started = false
  function start(){
    if (started) return
    started = true
    viewport.classList.add('ze-ready')
    requestAnimationFrame(fit)
  }

  const videos = Array.from(document.querySelectorAll('video[data-gate]'))
  let loaded = 0
  let fontsDone = false

  function maybeStart(){
    if (fontsDone && loaded >= videos.length) start()
  }

  videos.forEach(v => {
    // readyState >= 2 — данные уже есть, событие не придёт
    if (v.readyState >= 2) { loaded++ }
    else v.addEventListener('loadeddata', () => { loaded++; maybeStart() }, { once:true })
    // Автовоспроизведение иногда требует явного вызова
    const p = v.play()
    if (p && p.catch) p.catch(() => {})
  })

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { fontsDone = true; maybeStart() })
  } else {
    fontsDone = true
  }
  maybeStart()

  // Страховка: что бы ни случилось с сетью — показываем через 5 секунд
  setTimeout(start, 5000)
})()
</script>
