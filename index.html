<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дмитрий Волгин — сайты, которые живут</title>
    <meta
      name="description"
      content="Собираю сайты и приложения для брендов и команд, которым важно не только как выглядит, но и как работает."
    />
    <!-- Иконка вкладки квадратная и с полями: браузер вписывает её в
         квадрат, и широкий логотип он сплющивал -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Шрифты лежат на самом сайте (public/fonts), а не на Google: меньше
         подключений, и заголовок первого экрана не ждёт чужой сервер.
         Gravity грузим заранее: им набран заголовок, первое, что видно -->
    <link rel="preload" href="/fonts/gravity.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
